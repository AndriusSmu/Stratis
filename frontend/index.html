<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratis | Marketing Command Console</title>
    <!-- Dynamic high-tech S icon vector favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e293b'/%3E%3Cpath d='M30,35 C30,25 70,25 70,35 C70,45 30,45 30,55 C30,65 70,65 70,55' fill='none' stroke='%2338bdf8' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <svg class="header-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40"><rect width="100" height="100" rx="20" fill="#0284c7" /><path d="M30,35 C30,25 70,25 70,35 C70,45 30,45 30,55 C30,65 70,65 70,55" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <h1>Stratis</h1>
            </div>
            <p>Unified Marketing Strategic Control Console</p>
        </header>

        <!-- Dynamic Two-Column Layout Grid -->
        <div class="app-workspace">

            <!-- Left Panel: Context Action Form -->
            <div class="panel-left">
                <div class="card form-card">
                    <h2 id="form-title">➕ Create Strategy Matrix</h2>
                    <form id="campaign-form">
                        <input type="hidden" id="campaign-id" />

                        <div class="form-group">
                            <label for="name">Campaign Matrix Name *</label>
                            <input type="text" id="name" placeholder="e.g., Q3 Global Expansion 2026" required />
                        </div>

                        <div class="form-group">
                            <label for="description">Strategic Description</label>
                            <textarea id="description" placeholder="Specify tactical goals or primary channels..." rows="3"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="budget">Allocated Budget *</label>
                                <input type="number" id="budget" step="0.01" placeholder="0.00" required />
                            </div>
                            <div class="form-group">
                                <label for="currency">Currency Matrix</label>
                                <select id="currency">
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="GBP">GBP (£)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="start-date">Activation Date *</label>
                                <input type="date" id="start-date" required />
                            </div>
                            <div class="form-group">
                                <label for="end-date">Termination Date</label>
                                <input type="date" id="end-date" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="target-audience">Target Core Audience</label>
                            <input type="text" id="target-audience" placeholder="e.g., Tech decision-makers 30-50" />
                        </div>

                        <div class="form-group">
                            <label for="status">Deployment Phase State</label>
                            <select id="status">
                                <option value="Draft">📝 Draft Mode</option>
                                <option value="Active">🚀 Live Deployment</option>
                                <option value="Paused">⏸️ Execution Paused</option>
                                <option value="Completed">✅ Concluded</option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" id="submit-btn" class="btn btn-primary">➕ Deploy Campaign</button>
                            <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">❌ Clear Focus</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Panel: Aggregations & Database Feed -->
            <div class="panel-right">
                <div class="card dashboard-card">
                    <h2>📈 Active Allocation Status (USD)</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="stat-label">Live Active Operations</span>
                            <span class="stat-value" id="active-budget">$0.00</span>
                        </div>
                        <div class="stat-box">
                            <span class="stat-label">Total Strategy Footprint</span>
                            <span class="stat-value" id="total-budget">$0.00</span>
                        </div>
                    </div>
                </div>

                <div class="card list-card">
                    <div class="list-header">
                        <h2>📋 Strategy Registries</h2>
                        <div class="filters">
                            <select id="status-filter">
                                <option value="">All Matrix Phases</option>
                                <option value="Draft">Draft Mode</option>
                                <option value="Active">Live Deployment</option>
                                <option value="Paused">Execution Paused</option>
                                <option value="Completed">Concluded</option>
                            </select>
                            <input type="text" id="search-filter" placeholder="🔍 Filter Registry..." />
                        </div>
                    </div>
                    <div id="campaign-list">
                        <div class="loading">Parsing local database clusters...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
