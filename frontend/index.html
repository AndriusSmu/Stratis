<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stratis | Campaign Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="shell">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="28" height="28" class="brand-mark">
                    <rect width="100" height="100" rx="16" fill="#0ea5e9" />
                    <path d="M30,35 C30,25 70,25 70,35 C70,45 30,45 30,55 C30,65 70,65 70,55" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" />
                </svg>
                <span class="brand-name">Stratis</span>
            </div>

            <!-- AUTH SECTION -->
            <div id="auth-section">
                <div id="login-form">
                    <div class="field">
                        <label>Username</label>
                        <input type="text" id="login-username" placeholder="username" />
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="password" />
                    </div>
                    <button class="btn btn-primary" onclick="handleLogin()" style="width:100%;">Login</button>
                    <button class="btn btn-ghost" onclick="showRegisterForm()" style="width:100%;margin-top:8px;">Register</button>
                </div>
                
                <div id="register-form" style="display: none;">
                    <div class="field">
                        <label>Email</label>
                        <input type="email" id="register-email" placeholder="email@example.com" />
                    </div>
                    <div class="field">
                        <label>Username</label>
                        <input type="text" id="register-username" placeholder="username" />
                    </div>
                    <div class="field">
                        <label>Full Name</label>
                        <input type="text" id="register-fullname" placeholder="Full Name" />
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input type="password" id="register-password" placeholder="password (min 8 chars)" />
                    </div>
                    <button class="btn btn-primary" onclick="handleRegister()" style="width:100%;">Register</button>
                    <button class="btn btn-ghost" onclick="showLoginForm()" style="width:100%;margin-top:8px;">Back to Login</button>
                </div>
                
                <div id="user-info" style="display: none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
                        <span id="user-name" style="color:var(--text);font-size:0.9rem;">User</span>
                        <button class="btn btn-ghost" onclick="logout()" style="padding:4px 12px;font-size:0.75rem;">Logout</button>
                    </div>
                </div>
            </div>

            <!-- STATS -->
            <div class="sidebar-stats">
                <div class="stat-row">
                    <span class="stat-label">Active budget</span>
                    <span class="stat-num" id="active-budget">—</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Total footprint</span>
                    <span class="stat-num" id="total-budget">—</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Total spent</span>
                    <span class="stat-num" id="total-spent">—</span>
                </div>
                <div class="stat-divider"></div>
                <div class="status-counts" id="status-counts">
                    <div class="count-row"><span class="dot dot-Draft"></span><span class="count-label">Draft</span><span class="count-val" id="count-Draft">0</span></div>
                    <div class="count-row"><span class="dot dot-Active"></span><span class="count-label">Active</span><span class="count-val" id="count-Active">0</span></div>
                    <div class="count-row"><span class="dot dot-Paused"></span><span class="count-label">Paused</span><span class="count-val" id="count-Paused">0</span></div>
                    <div class="count-row"><span class="dot dot-Completed"></span><span class="count-label">Completed</span><span class="count-val" id="count-Completed">0</span></div>
                </div>
            </div>

                        <!-- Charts -->
            <div class="chart-section">
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="budgetChart"></canvas>
                </div>
            </div>

            <div class="expired-warning" id="expired-warning" style="display:none;">
                <span class="warn-icon">⚠</span>
                <span id="expired-text">campaigns may be expired</span>
            </div>

            <!-- AI INSIGHTS -->
            <div class="ai-insights-block">
                <div class="ai-insights-header">
                    <span class="ai-badge">AI</span>
                    <span class="ai-insights-title">Portfolio insights</span>
                </div>
                <div class="ai-insights-body" id="ai-insights-body">
                    <span class="ai-insights-placeholder">Run analysis to see AI insights.</span>
                </div>
                <button class="btn-ai-insights" id="btn-ai-insights" onclick="runInsights()">
                    Analyze campaigns
                </button>
            </div>

            <button class="btn-export" onclick="exportCSV()" style="margin-top:8px;">
                Export CSV
            </button>

            <div class="sidebar-note">All budgets shown in USD equivalent</div>
        </aside>

        <main class="main">

            <section class="form-panel">
                <div class="form-header">
                    <h2 id="form-title">New campaign</h2>
                </div>

                <form id="campaign-form" autocomplete="off">
                    <input type="hidden" id="campaign-id" />

                    <div class="field">
                        <label for="name">Campaign name <span class="required">*</span></label>
                        <input type="text" id="name" required />
                    </div>

                    <div class="field">
                        <label for="owner">Owner / responsible</label>
                        <input type="text" id="owner" placeholder="e.g. andrius@company.com" />
                    </div>

                    <div class="field">
                        <label for="target-audience">Target audience</label>
                        <input type="text" id="target-audience" />
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="budget">Budget <span class="required">*</span></label>
                            <input type="number" id="budget" step="0.01" required />
                        </div>
                        <div class="field">
                            <label for="currency">Currency</label>
                            <select id="currency">
                                <option value="USD">USD ($)</option>
                                <option value="EUR">EUR (€)</option>
                                <option value="GBP">GBP (£)</option>
                            </select>
                        </div>
                    </div>

                    <!-- AI BRIEF GENERATOR -->
                    <div class="ai-brief-bar">
                        <span class="ai-badge">AI</span>
                        <span class="ai-brief-label">Generate brief from name &amp; audience</span>
                        <button type="button" class="btn-generate-brief" id="btn-generate-brief" onclick="generateBrief()">
                            Generate
                        </button>
                    </div>
                    <div class="ai-brief-status" id="ai-brief-status" style="display:none;"></div>

                    <div class="field">
                        <label for="description">Description</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>

                    <div class="field">
                        <label for="tags">Tags (comma-separated)</label>
                        <input type="text" id="tags" placeholder="EMEA, LinkedIn, Azure" />
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="start-date">Start date <span class="required">*</span></label>
                            <input type="date" id="start-date" required />
                        </div>
                        <div class="field">
                            <label for="end-date">End date</label>
                            <input type="date" id="end-date" />
                        </div>
                    </div>

                    <div class="field">
                        <label for="spent">Spent</label>
                        <input type="number" id="spent" step="0.01" />
                    </div>

                    <div class="field">
                        <label for="status">Status</label>
                        <select id="status">
                            <option value="Draft">Draft</option>
                            <option value="Active">Active</option>
                            <option value="Paused">Paused</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="assets">Assets / files (links)</label>
                        <textarea id="assets" rows="2" placeholder="Links to briefs, media plans, creatives..."></textarea>
                    </div>

                    <div class="field">
                        <label for="notes">Notes / Results</label>
                        <textarea id="notes" rows="2"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary">Create campaign</button>
                        <button type="button" id="cancel-btn" class="btn btn-ghost" style="display:none;">Cancel</button>
                    </div>
                </form>
            </section>

            <section class="list-panel">
                <div class="list-top">
                    <h2>Campaigns</h2>
                    <div class="filters">
                        <select id="status-filter">
                            <option value="">All statuses</option>
                            <option value="Draft">Draft</option>
                            <option value="Active">Active</option>
                            <option value="Paused">Paused</option>
                            <option value="Completed">Completed</option>
                        </select>
                        <input type="text" id="search-filter" placeholder="Search..." />
                    </div>
                </div>

                <div id="campaign-list">
                    <div class="loading-state">Loading campaigns...</div>
                </div>
            </section>

        </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
