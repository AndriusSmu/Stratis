services:
  backend:
    build: ./backend
    container_name: stratis-backend
    ports:
      - "8000:8000"
    environment:
      - STRATIS_ENVIRONMENT=production
      - STRATIS_DEBUG=false
      - STRATIS_DB_PATH=/app/data/campaigns.db
      - STRATIS_SECRET_KEY=change-this-in-production
      - STRATIS_JWT_ALGORITHM=HS256
      - STRATIS_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - STRATIS_AI_ENABLED=true
      - STRATIS_OLLAMA_URL=http://ollama:11434/api/generate
      - STRATIS_OLLAMA_MODEL=llama3.2
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: stratis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: